<html>
<head>
    <title>Birthday Card</title>
    <style>
        body{
            background-color: #f0f0f0;
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 100px;
        }

        .card{
            background-color: #9cf6f6;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 350px;
            margin: auto;
            padding: 30px;
            outline: 3px solid #000;
            outline-offset: -10px;
        }

        .title{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .title img{
            width: 50px;
            height: 50px;
            margin: 0;
            animation: bounce 1s infinite;
        }

        h1{
            color: #ef3b8c;
            margin: 0;
            animation: bounce 1s infinite;
        }

        p{
            color: #424040;
            font-size: 18px;
        }

        @keyframes example {
            from {transform: scale(0);}
            to {transform: scale(1);}
        }

        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
            100% {
                transform: translateY(0);
            }
        }

        .cake{
            width: 40%;
            height: auto;
            margin-top: 15px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            animation: example 3s ease 1s infinite alternate;
        }
    </style>
</head>

<body>
    <div class="card">

        <div class="title">
            <img src="C:\Users\LENOVO\Downloads\132ba065-327e-472b-add0-0b4a42f58fd2.tmp" alt="Balloon">
            <h1>Happy Birthday!</h1>
            <img src="C:\Users\LENOVO\Downloads\132ba065-327e-472b-add0-0b4a42f58fd2.tmp" alt="Balloon">
        </div>

        <img class="cake" src="C:\Users\LENOVO\Downloads\birthday cake.jpg" alt="Birthday Cake">

        <marquee>
            <p>Wishing you a fantastic day filled with joy and laughter!</p>
        </marquee>

    </div>
</body>
</html>
