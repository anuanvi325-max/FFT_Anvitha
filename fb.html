<html>
<head>
<title>Facebook Login</title>
<style>
body{
    background-color:#f0f2f5; 
    font-family:Arial;
}
.left{
    margin-top:150px; 
    margin-left:150px; 
    float:left;
}
.left h1{
    color:blue;
     font-size:50px;
    }
.left p{
    font-size:25px;
}
.login-box{
    background-color:white;
    width:350px; 
    padding:20px; 
    margin-top:120px;
    margin-right:150px;
    float:right;
    border:1px solid lightgray;}
input{
    width:100%; 
    height:40px; 
    margin-bottom:10px;
}
.login-btn{
    width:100%; 
    height:40px; 
    background-color:blue; 
    color:white;
    border:none;
}
.forgot{
    display:block; 
    text-align:center; 
    margin-top:10px; 
    margin-bottom:10px;
}
.create-btn{
    background-color:rgb(0, 157, 0); 
    color:white; 
    border:none; 
    height:40px; 
    width:180px; 
    margin-left:80px;}
</style>
</head>
<body>
<div class="left">
    <h1>facebook</h1>
    <p>Connect and share with the people in your life.</p>
</div>
<div class="login-box">
    <input type="text" placeholder="Email address or phone number">
    <input type="password" placeholder="Password">
    <button class="login-btn">Log In</button>
    <a href="#" class="forgot">Forgotten password?</a>
    <hr>
    <button class="create-btn">Create New Account</button>
</div>
</body>
</html>
