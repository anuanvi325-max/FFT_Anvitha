<html>
    <head>
        <title>Student Registration Form</title>
    </head>
    <style>
        
        form{
            border: 1px solid rgb(10, 10, 10);
            border-radius: 10px;
            padding: 20px;
            width: 400px;
            margin: auto;
            border-radius: 20px;
            background-color: rgb(147, 215, 237);
            box-shadow: 6px 10px 14px rgba(0, 0, 0, 0.1);
        }
        h1{
            text-align: center;
        }
        label{
            display: inline-block;
            width: 100px;
            margin-bottom: 10px;
        }
        input[type="text"], 
        input[type="number"], 
        input[type="date"], 
        input[type="email"], 
        input[type="password"], 
        input[type="file"]{
            width: 250px;
            padding: 5px;
            margin-bottom: 10px;
        }
        input[type="submit"], input[type="reset"]{
            padding: 5px 10px;
            margin-top: 10px;
        }
        #b1{
            background-color: rgb(33, 186, 79);
            color: white;
            border: 2px solid rgb(15, 15, 15);
            width: 100px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            margin: 0
            auto;

        }
        #b1:hover{
            background-color: rgb(15, 15, 15);
            color: white;
        }
        #b2{
            background-color: rgb(235, 48, 48);
            color: white;
            border: 2px solid rgb(15, 15, 15);
            width: 100px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            margin: 0auto;
        }
        #b2:hover{
            background-color: rgb(15, 15, 15);
            color: white;
        }
    </style>
    <body>

        <form>
            <h1>Student Registration Form</h1>

            <label>Reg Id:</label>
            <input type="number" placeholder="Enter Registration ID"><br><br>

            <label>Name:</label>
            <input type="text" placeholder="Enter Name"><br><br>

            <label>Gender:</label>
            <input type="text" placeholder="Enter Gender"><br><br>

            <label>DOB:</label>
            <input type="date" placeholder="Enter Date of Birth"><br><br>

            <label>Ph No:</label>
            <input type="number" placeholder="Enter Phone Number"><br><br>

            <label>Address:</label>
            <input type="text" placeholder="Enter Address"><br><br>

            <label>Department:</label>
            <input type="text" placeholder="Enter Department"><br><br>

            <label>Course:</label>
            <input type="text" placeholder="Enter Course"><br><br>

            <label>Email:</label>
            <input type="email" placeholder="Enter Email"><br><br>

            <label>Password:</label>
            <input type="password" placeholder="Enter Password"><br><br>

            <label>Resume:</label>
            <input type="file" placeholder="Upload Resume"><br><br>

            <div class="button-group">
    <button id="b1">Submit</button>
    <button id="b2">Reset</button>
</div>
        </form>

    </body>
</html>
