<html>
    <head>
        <title>Facebook Login</title>
    </head>

    <style>
        body {
            background-color: #f0f2f5;
        }

        form {
            width: 300px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: white;
        }

        h1 {
            text-align: center;
            margin-top: 100px;
            margin-bottom: 20px;
            color: rgb(42, 149, 231);
        }

        #email,
        #password {
            width: 100%;
            height: 35px;
            box-sizing: border-box;
        }

        #b1 {
            background-color: rgb(53, 139, 225);
            color: white;
            width: 100%;
            height: 35px;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }

        #b2 {
            background-color: rgb(69, 207, 94);
            color: white;
            width: 150px;
            height: 35px;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }

        #fp {
            color: rgb(42, 149, 231);
            text-decoration: underline;
            cursor: pointer;
            display: block;
            text-align: center;
            margin: 10px 0;
        }

        hr {
            margin: 15px 0;
        }
    </style>

    <body>
        <h1>facebook</h1>

        <form action="login.php" method="post">

            <label for="email"></label>
            <input type="email" placeholder="Enter your email or username" id="email" name="email" required><br><br>

            <label for="password"></label>
            <input type="password" placeholder="Enter your password" id="password" name="password" required><br><br>

            <div>
                <input type="submit" value="Login in" id="b1"><br>

                <text id="fp">forget password?</text>

                <hr>

                <input type="submit" value="Create New Account" id="b2">
            </div>

        </form>
    </body>
</html>
